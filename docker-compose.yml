services:
  postgres:
    image: postgres:16-alpine
    container_name: filament-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: filament
      POSTGRES_USER: filament
      POSTGRES_PASSWORD: filament
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filament -d filament"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: filament-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: filament-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://filament:filament@postgres:5432/filament?sslmode=disable
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: filament-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://filament:filament@postgres:5432/filament?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
      BAMBU_SECRETS_KEY: local-compose-secrets-key-change-me
      SESSION_SECRET: local-compose-session-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      PUBLIC_BASE_URL: http://localhost:8080
      REQUIRE_POSTGRES: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
